services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - chacha-data:/data
    restart: unless-stopped

  nginx:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  chacha-data:
