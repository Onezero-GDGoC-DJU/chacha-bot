limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;

server {
  listen 80;
  client_max_body_size 16k;

  # ngrok 뒤에서도 IP별 속도 제한이 동작하도록 실제 접속 IP를 복원해요 (명세서 B7)
  # - 내 PC(ngrok 에이전트)에서 들어온 요청은 Docker 게이트웨이(172.16.0.0/12 대역) 주소로 보여요
  # - 이 대역에서 온 요청만 X-Forwarded-For를 믿고, 그중 믿을 수 없는 마지막 주소를 실제 IP로 써요
  # - 사용자가 X-Forwarded-For를 직접 넣어도 ngrok이 실제 IP를 뒤에 덧붙여서 속일 수 없어요
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/chat {
    limit_req zone=chat burst=3 nodelay;
    limit_req_status 429;

    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 90s;
  }
}
